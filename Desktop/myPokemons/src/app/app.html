<nav>
  <div class="nav-wrapper teal">

    <a routerLink="/pokemon/all" class="brand-logo" style="padding-left: 16px;">
      Application de pokémons
    </a>

    <ul class="right hide-on-med-and-down">

      @if (isLoggedIn()) {
        <li><a routerLink="/pokemon/all">Liste</a></li>
        <li><a routerLink="/pokemon/favorites">Favoris</a></li>
        <li><a routerLink="/pokemon/compare">Comparer</a></li>

        <li class="account-menu">
          <a style="cursor: pointer;">
            <i class="material-icons">account_circle</i>
          </a>
          <div class="submenu">
            <div class="user-email">{{ getCurrentUser()?.email }}</div>
            <a (click)="logout()" style="cursor: pointer;">
              <i class="material-icons">logout</i> Déconnexion
            </a>
          </div>
        </li>

      } @else {
        <li><a routerLink="/login">Se connecter</a></li>
        <li><a routerLink="/register">S'inscrire</a></li>
      }

    </ul>
  </div>
</nav>

<div [@pageTransition]="routeState">
  <router-outlet />
</div>
